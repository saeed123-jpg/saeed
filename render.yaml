services:
  - type: web
    name: palestine-atlas
    runtime: static
    repo: https://github.com/saeed123-jpg/saeed
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /downloads/atlas-palestine.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/atlas-palestine.apk
        name: Content-Disposition
        value: attachment; filename="atlas-palestine.apk"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
